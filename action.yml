name: wormsign scan
description: Find agent worms (Miasma, Mini Shai-Hulud) in a GitHub account, organization or repository, through the API only.
author: nukoe-labs
branding:
  icon: shield
  color: red
inputs:
  target:
    description: A user, an organization, or an owner/repo. Defaults to the owner of the current repository.
    required: false
    default: ${{ github.repository_owner }}
  max-branches:
    description: The highest number of branches read per repository.
    required: false
    default: "20"
  fail-on-findings:
    description: Set to "false" to keep the job green when worm signs are found (the summary and outputs still report them).
    required: false
    default: "true"
  sarif:
    description: Set to "true" to write wormsign.sarif for github/codeql-action/upload-sarif.
    required: false
    default: "false"
  token:
    description: The token used to read the GitHub API. The default token only reads public repositories and the current one; use a read-only fine-grained token to scan every private repository of an organization.
    required: false
    default: ${{ github.token }}
outputs:
  findings:
    description: The number of worm signs found.
  repositories:
    description: The number of repositories read.
runs:
  using: node24
  main: dist/action-main.js
