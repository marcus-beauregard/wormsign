name: wormsign
description: Find agent worms (Miasma, Mini Shai-Hulud) in a GitHub account, organization or repository, through the API only.
author: nukoe-labs
branding:
  icon: shield
  color: red
inputs:
  target:
    description: A user, an organization, or an owner/repo. Defaults to the owner of the current repository.
    required: false
    default: ${{ github.repository_owner }}
  max-branches:
    description: The highest number of branches read per repository.
    required: false
    default: "20"
  sarif:
    description: Set to "true" to write wormsign.sarif for github/codeql-action/upload-sarif.
    required: false
    default: "false"
  token:
    description: The token used to read the GitHub API.
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
    - name: Build wormsign
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --ignore-scripts && npm run build
    - name: Scan
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        WORMSIGN_TARGET: ${{ inputs.target }}
        WORMSIGN_MAX_BRANCHES: ${{ inputs.max-branches }}
        WORMSIGN_SARIF: ${{ inputs.sarif }}
        WORMSIGN_CLI: ${{ github.action_path }}/dist/cli.js
      run: |
        if [ "$WORMSIGN_SARIF" = "true" ]; then
          node "$WORMSIGN_CLI" "$WORMSIGN_TARGET" --max-branches "$WORMSIGN_MAX_BRANCHES" --sarif > wormsign.sarif
        else
          node "$WORMSIGN_CLI" "$WORMSIGN_TARGET" --max-branches "$WORMSIGN_MAX_BRANCHES"
        fi
